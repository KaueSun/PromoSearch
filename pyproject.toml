[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-gamer"
version = "0.2.0"
description = "Monitor conservador de ofertas reais, PostgreSQL e Discord"
requires-python = ">=3.12"
dependencies = ["SQLAlchemy==2.0.49", "psycopg[binary]==3.3.4", "cryptography>=46,<49"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-cov>=6,<8", "ruff>=0.12,<1", "PyYAML==6.0.3"]

[project.scripts]
radar = "radar_gamer.cli:main"

[tool.setuptools.packages.find]
include = ["radar_gamer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: integration with a real disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

