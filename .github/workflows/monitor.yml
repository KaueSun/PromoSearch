name: Radar Gamer
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Operação (cadastro exige configuração revisada e assinatura de inspect)
        type: choice
        options: [check, watch, unwatch]
        default: check
      url:
        description: Link completo do anúncio Mercado Livre recebido manualmente
        type: string
      sku:
        description: Chave da configuração exata em config/catalog.json
        type: string
      signature:
        description: Assinatura de metadados revisada por inspect (SHA-256)
        type: string

permissions:
  contents: read
concurrency:
  group: radar-production
  cancel-in-progress: false

jobs:
  monitor:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Instalar dependências verificadas
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Aplicar cadastro manual e consultar fontes reais
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_SKU: ${{ inputs.sku }}
          INPUT_SIGNATURE: ${{ inputs.signature }}
        run: |
          python radar.py cloud-input
          python radar.py check --send
          python radar.py status

